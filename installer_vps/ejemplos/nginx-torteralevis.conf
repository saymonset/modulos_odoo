# ============================================================
# Plantilla nginx para cliente — renderizada por
# installer_vps/3.5_instalar_nginx_certbot.sh
# Placeholders: torteralevis, integraia.lat, /etc/letsencrypt/live/torteralevis.integraia.lat
# ============================================================

# ---------- Upstreams ----------
upstream odoo {
    server 127.0.0.1:18069;
}

upstream odoo_longpolling {
    server 127.0.0.1:18072;
}

upstream odoo_leads {
    server 127.0.0.1:28069;
}

upstream odoo_leads_longpolling {
    server 127.0.0.1:28072;
}

upstream chatwoot {
    server 127.0.0.1:3000;
}

upstream n8n {
    server 127.0.0.1:5678;
    keepalive 32;
}

upstream postiz {
    server 127.0.0.1:4007;
}

upstream pgadmin {
    server 127.0.0.1:8080;
}

upstream temporal_ui {
    server 127.0.0.1:8180;
}

# ============================================================
# DOMINIO PRINCIPAL torteralevis.integraia.lat -> Odoo
# ============================================================
server {
    listen 80;
    server_name torteralevis.integraia.lat;

    include snippets/letsencrypt.conf;

    location / {
        return 301 https://torteralevis.integraia.lat$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name torteralevis.integraia.lat;

    ssl_certificate /etc/letsencrypt/live/torteralevis.integraia.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torteralevis.integraia.lat/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/torteralevis.integraia.lat/chain.pem;
    include snippets/ssl.conf;
    include snippets/letsencrypt.conf;

    access_log /var/log/nginx/torteralevis-odoo.access.log;
    error_log /var/log/nginx/torteralevis-odoo.error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    location ~ \.css$ {
        proxy_pass http://odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "text/css" always;
    }

    location ~* /web/static/ {
        proxy_pass http://odoo;
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 864000;
        add_header Cache-Control "public, immutable";
    }

    location /websocket {
        proxy_pass http://odoo_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_connect_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /longpolling/ {
        proxy_pass http://odoo_longpolling;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Bloqueo API RPC deprecated (vector de ataques conocido)
    location ^~ /xmlrpc  { return 403; }
    location ^~ /jsonrpc { return 403; }
    location ^~ /web/database { return 403; }

    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }
}

