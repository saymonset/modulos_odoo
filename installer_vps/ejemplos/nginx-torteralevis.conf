# ============================================================
# n8n.torteralevis.integraia.lat
# ============================================================
server {
    listen 80;
    server_name n8n.torteralevis.integraia.lat;

    include snippets/letsencrypt.conf;

    location / {
        return 301 https://n8n.torteralevis.integraia.lat$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name n8n.torteralevis.integraia.lat;

    ssl_certificate /etc/letsencrypt/live/torteralevis.integraia.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torteralevis.integraia.lat/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/torteralevis.integraia.lat/chain.pem;
    include snippets/ssl.conf;
    include snippets/letsencrypt.conf;

    underscores_in_headers on;
    client_max_body_size 50M;

    access_log /var/log/nginx/n8n.access.log;
    error_log /var/log/nginx/n8n.error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    location / {
        proxy_pass http://n8n;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        proxy_pass http://n8n;
        proxy_cache_valid 200 90m;
        proxy_buffering on;
        expires 10d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;
    gzip_vary on;
    gzip_min_length 1024;
}

